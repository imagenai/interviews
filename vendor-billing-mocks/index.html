<style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0}
body{display:grid;place-items:center;padding:48px 16px;background:#07080c;
background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px}
nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;width:min(1040px,100%)}
a{position:relative;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:4/3;padding:26px;
border-radius:22px;text-decoration:none;overflow:hidden;isolation:isolate;
border:1px solid rgba(255,255,255,.1);transition:transform .2s ease,box-shadow .2s ease}
a::after{content:"\2197";position:absolute;top:22px;right:24px;font:600 22px/1 system-ui,sans-serif;color:inherit;
opacity:0;transform:translate(-6px,6px);transition:.2s ease}
a:hover,a:focus-visible{transform:translateY(-5px);box-shadow:0 22px 50px -18px var(--g)}
a:hover::after,a:focus-visible::after{opacity:.85;transform:none}
a:focus-visible{outline:2px solid var(--g);outline-offset:3px}
a svg{width:58px;height:58px;display:block}
a span{font-size:clamp(26px,3vw,36px);line-height:1}
@media (max-width:820px){nav{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){nav{grid-template-columns:1fr}a{aspect-ratio:auto;min-height:150px}}
@media (prefers-reduced-motion:reduce){a,a::after{transition:none}}
</style></head>

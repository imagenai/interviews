<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Vendor billing portals</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#0b0d12;font:600 17px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:min(560px,calc(100vw - 32px))}
a{display:grid;place-items:center;height:96px;border-radius:16px;color:#fff;text-decoration:none;letter-spacing:.01em;
border:1px solid rgba(255,255,255,.08);transition:transform .15s,box-shadow .15s}
a:hover{transform:translateY(-2px);box-shadow:0 12px 32px -8px var(--g)}
@media (max-width:420px){nav{grid-template-columns:1fr}}
</style></head>
<body><nav><a href='cloudly/' style='background:linear-gradient(135deg,#ff7a2f,#8b5cff);--g:#ff7a2f'>Cloudly</a><a href='trackr/' style='background:linear-gradient(135deg,#7cf0d5,#7b8cff);color:#10132b;--g:#7b8cff'>Trackr</a><a href='mongr/' style='background:#050a07;color:#39ff88;border-color:#39ff88;font-family:ui-monospace,Menlo,monospace;--g:#39ff88'>Mongr</a><a href='logbase/' style='background:linear-gradient(135deg,#ff2d95,#2b0b5e);--g:#ff2d95'>Logbase</a></nav></body></html>
